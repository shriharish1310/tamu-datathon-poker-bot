name: Starfish team integration validation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Install pinned dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Official protocol and upstream strategy tests
        run: python -m pytest -q
      - name: Exact-commit official Docker checks
        run: |
          mkdir -p reports
          set -o pipefail
          bash tools/check_build.sh 2>&1 | tee reports/official-docker-check.log
      - name: Preserve check output
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: starfish-quad-release-checks
          path: reports/
