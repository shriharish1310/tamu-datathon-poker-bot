name: Starfish release checks

on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  release-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PYTHONUTF8: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Full correctness and fault-injection tests
        run: python -m pytest -q
      # These matches are sequential and run before Docker builds to avoid
      # competing CPU load. They measure host HTTP timing, not container timing.
      - name: Fresh-process matches on additional seeds
        timeout-minutes: 12
        run: python tools/evaluate_suite.py --seeds 731 947 --deals 1000 --output reports/linux-reliability
      - name: Official Docker build and smoke check
        timeout-minutes: 30
        run: |
          mkdir -p reports
          bash tools/check_build.sh 2>&1 | tee reports/official-build.log
      - name: Reject hidden faults in the restricted container
        run: python tools/check_container_reliability.py --output reports/container-reliability.json
      - name: Preserve validation evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: starfish-release-evidence
          path: reports/
          if-no-files-found: warn
          retention-days: 30
