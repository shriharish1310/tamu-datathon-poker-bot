name: Batch03 bounded HTTP parser diagnosis
on:
  workflow_call:
permissions:
  contents: read
jobs:
  parser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.10.11'
      - run: python -m pip install -r experiments/batch03-runtime-requirements.txt httptools==0.8.0
      - run: python -m tools.batch03_parser
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: batch03-parser
          path: reports/batch03-parser/
          retention-days: 30
