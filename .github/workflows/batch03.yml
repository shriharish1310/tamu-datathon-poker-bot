name: Batch03 controlled runtime and preflop hybrid
on:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  batch03:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      PYTHONUTF8: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.10.11'
      - name: Install frozen runtime and passive monitor
        run: python -m pip install -r experiments/batch03-runtime-requirements.txt pytest
      - name: Correctness tests before timing
        run: python -m pytest -q
      - name: Freeze exact packages
        run: python tools/batch03.py init
      - name: Fixed-work microbenchmark before HTTP comparisons
        run: python tools/batch03_microbench.py
      - name: Interleaved runtime repeats
        run: python tools/batch03.py runtime
      - name: Matched hybrid screen
        run: python tools/batch03.py screen
      - name: Confirmation only if predefined screen gate passes
        run: python tools/batch03.py confirm
      - name: Preserve Python 3.10 evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: batch03-linux-python310
          path: reports/batch03/
          retention-days: 30
      - name: Move evidence before controlled interpreter comparison
        run: mv reports/batch03 reports/batch03-python310
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Install same runtime dependencies
        run: python -m pip install -r experiments/batch03-runtime-requirements.txt pytest
      - name: Interleaved runtime repeats under Python 3.12
        run: |
          python tools/batch03.py init
          python tools/batch03_microbench.py
          python tools/batch03.py runtime
      - name: Preserve Python 3.12 evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: batch03-linux-python312
          path: reports/batch03/
          retention-days: 30
