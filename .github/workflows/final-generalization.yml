name: Locked final generalization evaluation
on:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: starfish-final-generalization
  cancel-in-progress: false
jobs:
  final:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PYTHONUTF8: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt psutil==7.1.3
      - name: Verify frozen inputs and locked schedule
        run: python tools/final_generalization.py --check
      - name: Build unmodified official base
        run: docker build -t poker-agent-base:local - < docker/Dockerfile.base
      - name: Validate exact commit and run 36 sequential official matches
        run: python tools/final_generalization.py
      - name: Preserve every completed or failed match
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: final-generalization
          path: reports/final-generalization/
          retention-days: 90
