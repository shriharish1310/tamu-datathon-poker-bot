name: Batch04 official Docker runtime investigation
on:
  workflow_call:
    inputs:
      phase:
        type: string
        required: true
permissions:
  contents: read
jobs:
  batch04:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PYTHONUTF8: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt psutil==7.1.3
      - name: Build unmodified official base
        run: docker build -t poker-agent-base:local - < docker/Dockerfile.base
      - name: Run bounded batch phase
        run: python tools/batch04.py '${{ inputs.phase }}'
      - name: Preserve evidence even on failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: batch04-${{ inputs.phase }}
          path: reports/batch04/
          retention-days: 30
